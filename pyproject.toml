[project]
name = "pm25bench"
version = "0.1.0"
description = "Benchmark aberto de previsão de MP2,5 em estações da CETESB usando a reanálise do SISAM"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Turma CAP-408" },
]
requires-python = ">=3.12"
keywords = ["benchmark", "air quality", "pm2.5", "nowcasting", "cetesb", "sisam"]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "pooch>=1.8",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.scripts]
pm25bench = "pm25bench.cli:main"

# Cada modelo é um plugin. Modelos de outros pacotes se registram neste mesmo grupo.
[project.entry-points."pm25bench.models"]
persistence = "pm25bench.models.persistence:Persistence"
climatology = "pm25bench.models.climatology:Climatology"
reanalysis_raw = "pm25bench.models.reanalysis:RawReanalysis"
linear_regression = "pm25bench.models.linear:LinearRegression"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pooch.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pm25bench --cov-report=term-missing"
markers = ["realdata: testes que precisam dos dados reais baixados"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff.lint.per-file-ignores]
"src/pm25bench/data/_registry.py" = ["E501"]
